<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Shaboo's Services</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- HEADER -->
    <header class="header">

        <!-- Logo: Clicking returns to homepage -->
        <a href="index.html" class="logo">
            <img src="images/Shaboo's Logo.png" alt="Shaboo Logo">
        </a>

        <h2 class="site-title">SHABOO'S SERVICES</h2>

        <!-- Social Media Links -->
        <div class="social-links">
            <a href="https://www.instagram.com/llshabooll?avpt=MTRycXhocmtzZ3Zzbw==" aria-label="Instagram">
                <img src="images/instagram.png" alt="instagram">
            </a>

            <a href="https://www.tiktok.com/@shaboo979?_r=1&_t=ZP-9BUmbZWSDC3" aria-label="TikTok">
                <img src="images/tiktok.png" alt="tiktok">
            </a>

            <a href="https://youtube.com/@shaboo3495?si=aZJQZxYUv1STf1D-" aria-label="YouTube">
                <img src="images/youtube.png" alt="youtube">
            </a>

            <a href="https://www.facebook.com/share/1E8beCHmyG/" aria-label="Facebook">
                <img src="images/facebook.png" alt="facebook">
            </a>
        </div>

        <!-- NAVIGATION -->
        <nav class="navbar">
            <a href="about.html">About</a>
            <a href="gallery.html">Gallery</a>
            <a href="faq.html">FaQ</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>

    </header>


    <!-- WHITE SEPARATOR -->
    <div class="separator"></div>


    <!-- CONTACT PAGE -->
    <main class="page-section">

        <div class="section-label">
            <h1>Contact</h1>
        </div>

        <div class="contact-layout">

            <!-- LEFT SIDE -->
            <div class="contact-intro">

                <h2>
                    Tell me about your
                    next project.
                </h2>

                <p>
                    Share a few details and I'll help shape the best
                    creative direction, format and production approach
                    for your goals.
                </p>

            </div>


            <!-- RIGHT SIDE: CONTACT FORM -->
            <div class="contact-container">

                <form action="#" method="POST">

                    <div class="form-grid">

                        <div class="form-group">
                            <label for="name">Name</label>
                            <input type="text" id="name" name="name" required>
                        </div>

                        <div class="form-group">
                            <label for="email">Email</label>
                            <input type="email" id="email" name="email" required>
                        </div>

                        <div class="form-group">
                            <label for="company">Company</label>
                            <input type="text" id="company" name="company" required>
                        </div>

                        <div class="form-group">
                            <label for="project">Project</label>
                            <input type="text" id="project" name="project" required>
                        </div>

                        <div class="form-group">
                            <label for="budget">Budget Range</label>
                            <input type="number" id="budget" name="budget" required>
                        </div>

                        <div class="form-group">
                            <label for="date">Completion Date</label>
                            <input type="date" id="date" name="date" required>
                        </div>

                        <div class="form-group full-width">
                            <label for="description">Description</label>
                            <textarea id="description" name="description" required></textarea>
                        </div>

                    </div>

                    <button type="submit">CONFIRM</button>

                </form>

            </div>

        </div>

    </main>


    <!-- FOOTER -->
    <footer class="footer">
        <p>ShaBoo Copyright 2026</p>
    </footer>

</body>

</html>
